name: file_anchor
description: Pick a file or folder once and keep durable access to it across restarts and reboots, on Android, iOS and Windows.
version: 0.1.0
repository: https://github.com/Code-Making/file_anchor
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  file_anchor_platform_interface: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platform_interface_package: file_anchor_platform_interface
    platforms:
      # Each platform is declared only once its implementation package exists;
      # pub refuses to resolve a default_package that is not there yet.
      android:
        default_package: file_anchor_android
