name: file_anchor_macos
description: macOS implementation of file_anchor, using NSOpenPanel and security-scoped bookmarks.
version: 0.1.0
repository: https://github.com/Code-Making/file_anchor
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.24.0"

dependencies:
  file_anchor_path_io: ^0.1.0
  file_anchor_platform_interface: ^0.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: file_anchor
    platforms:
      macos:
        pluginClass: FileAnchorMacosPlugin
        dartPluginClass: FileAnchorMacOS
