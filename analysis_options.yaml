# Shared analysis rules for every package in the workspace.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Pre-declared so Flutter's `pub get` auto-migration has nothing to rewrite;
  # since 3.47 it appends these itself and dirties the working tree.
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Every public member must be documented: this is what pub.dev scores, and
    # an undocumented platform quirk is how the traps in this package get
    # reintroduced later.
    public_member_api_docs: warning

linter:
  rules:
    - always_declare_return_types
    - avoid_catching_errors
    - directives_ordering
    - omit_local_variable_types
    - prefer_final_locals
    - prefer_single_quotes
    - public_member_api_docs
    - require_trailing_commas
    - sort_pub_dependencies
    - unawaited_futures
    - use_super_parameters
